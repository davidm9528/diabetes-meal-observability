<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Log CGM</title>
</head>
<body>
  <!-- Button to go to meal logging page -->
  <a href="/meal">
    <button type="button">Log a Meal</button>
  </a>
  
  <h2>Submit CGM Log</h2>
  <form method="POST" action="/log">
    <label for="bg">Blood Glucose (mmol/L):</label><br>
    <input type="number" id="bg" name="bg" step="0.1" required><br><br>

    <label for="trend">Trend:</label><br>
    <select id="trend" name="trend" required>
      <option value="→">→ Stable</option>
      <option value="↑">↑ Rising</option>
      <option value="↓">↓ Falling</option>
    </select><br><br>

    <label for="notes">Notes:</label><br>
    <input type="text" id="notes" name="notes" value="Manual entry"><br><br>

    <input type="submit" value="Submit">
  </form>

  <br><br>
</body>
</html>
